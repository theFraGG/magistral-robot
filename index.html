<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-модель: Робот «Магистраль-Защита»</title>
    <script type="module" src="https://unpkg.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #334155;
            text-align: center;
            z-index: 10;
        }
        h1 { font-size: 18px; color: #f59e0b; text-transform: uppercase; letter-spacing: 0.5px; }
        p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        model-viewer {
            width: 100%;
            flex-grow: 1;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            --poster-color: transparent;
        }
        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Робот «Магистраль-Защита»</h1>
        <p>Вращайте одним пальцем / мышкой • Приближайте двумя пальцами / колёсиком</p>
    </header>

    <div class="status" id="loader-text">Загрузка 3D-модели...</div>

    <model-viewer 
        id="viewer"
        src="./robot.glb" 
        alt="3D-модель робота Магистраль-Защита"
        camera-controls 
        auto-rotate 
        shadow-intensity="1"
        exposure="1.2"
        camera-target="auto auto auto"
        bounds="tight">
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        const loader = document.getElementById('loader-text');
        viewer.addEventListener('load', () => {
            loader.style.display = 'none';
        });
        viewer.addEventListener('error', () => {
            loader.textContent = 'Ошибка загрузки модели. Проверьте файл robot.glb';
            loader.style.color = '#ef4444';
        });
    </script>

</body>
</html>
