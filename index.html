<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-модель: Робот «Магистраль-Защита»</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 15px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #334155; text-align: center; z-index: 10; }
        h1 { font-size: 18px; color: #f59e0b; text-transform: uppercase; }
        p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        #canvas-container { width: 100%; flex-grow: 1; position: relative; }
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #94a3b8; font-size: 14px; }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <header>
        <h1>Робот «Магистраль-Защита»</h1>
        <p>Вращайте одним пальцем / мышкой • Приближайте колёсиком</p>
    </header>
    <div id="canvas-container">
        <div id="status">Загрузка 3D-модели...</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const status = document.getElementById('status');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;

        scene.add(new THREE.AmbientLight(0xffffff, 1.3));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://gstatic.com');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        loader.load('./robot.glb', function(gltf) {
            const model = gltf.scene;
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            model.position.sub(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            camera.position.set(maxDim * 1.4, maxDim * 0.9, maxDim * 1.4);
            controls.update();

            scene.add(model);
            status.style.display = 'none';
        }, undefined, function(error) {
            status.textContent = 'Ошибка загрузки: ' + error.message;
            status.style.color = '#ef4444';
        });

        window.addEventListener('resize', function() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
