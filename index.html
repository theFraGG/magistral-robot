<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-модель: Робот «Магистраль-Защита»</title>
    <!-- Подключаем официальный 3D-просмотрщик от Google -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #334155;
            text-align: center;
            z-index: 10;
        }
        h1 { font-size: 18px; color: #f59e0b; text-transform: uppercase; letter-spacing: 0.5px; }
        p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        model-viewer {
            width: 100%;
            flex-grow: 1;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            --poster-color: transparent;
        }
    </style>
</head>
<body>

    <header>
        <h1>Робот «Магистраль-Защита»</h1>
        <p>Вращайте одним пальцем / мышкой • Приближайте двумя пальцами / колёсиком</p>
    </header>

    <!-- Интерактивная 3D-модель с поддержкой анимации и AR -->
    <model-viewer 
        src="robot.glb" 
        alt="3D-модель робота Магистраль-Защита"
        camera-controls 
        auto-rotate 
        autoplay
        shadow-intensity="1"
        exposure="1.1"
        ar
        ar-modes="webxr scene-viewer quick-look">
    </model-viewer>

</body>
</html>
